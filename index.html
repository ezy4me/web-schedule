    <style>
      /* Экран загрузки: виден, пока грузится бандл; React заменит содержимое #root */
      html,
      body {
        margin: 0;
        background-color: #faf9f6;
      }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1c1a17;
        -webkit-font-smoothing: antialiased;
      }
      .boot-mark {
        width: 84px;
        height: 84px;
      }
      .boot-title {
        margin: 18px 0 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .boot-hint {
        margin: 5px 0 0;
        font-size: 12px;
        color: #9a9387;
      }
      .boot-bar {
        position: relative;
        width: 96px;
        height: 2px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: #e7e3da;
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 36px;
        height: 100%;
        border-radius: 999px;
        background: #bd6b3f;
        animation: boot-slide 1.25s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-36px);
        }
        100% {
          transform: translateX(96px);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #121110;
        }
        .boot {
          color: #f3f0ea;
        }
        .boot-hint {
          color: #8f8880;
        }
        .boot-bar {
          background: #2b2825;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#1c1a17" />
          <rect x="15" y="12" width="34" height="40" rx="6" fill="#faf9f6" />
          <rect x="21" y="18" width="22" height="7" rx="3.5" fill="#bd6b3f" />
          <rect x="21" y="29" width="17" height="3.4" rx="1.7" fill="#2b2825" />
          <rect x="21" y="35.5" width="17" height="3.4" rx="1.7" fill="#2b2825" />
          <rect x="21" y="42" width="10" height="3.4" rx="1.7" fill="#2b2825" />
        </svg>
        <p class="boot-title">Расписание</p>
        <p class="boot-hint">Загрузка…</p>
        <div class="boot-bar" aria-hidden="true"></div>
        <noscript>
          <style>
            .boot-hint,
            .boot-bar {
              display: none;
            }
          </style>
          <p class="boot-hint" style="display: block; max-width: 220px; text-align: center; margin-top: 12px">
            Для работы расписания нужен JavaScript
          </p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
